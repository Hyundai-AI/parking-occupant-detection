# 다중 보드: 허브 C (DESIGN.md §7.4, §7.5). 카메라·모델 없음.
# PC 한 대에서 시험할 때는 127.0.0.1을 쓴다. 실기: bind를 "0.0.0.0:5005", 노드 주소를 각 파이 IP로.

hub:
  node: C
  bind: 127.0.0.1:5005
  nodes:
    - { name: A, address: 127.0.0.1:5006 }
    - { name: B, address: 127.0.0.1:5007 }
  heartbeat_ms: 200
  node_timeout_ms: 500
  max_evidence_age_ms: 1000
  confirm_timeout_s: 3.0
  metrics_interval_s: 5

outputs:
  - name: console                 # 판정 로그
    options: {}
  - name: state_server            # 출력 상태 서버: 출력 Pi(D)의 화면·신호등·음성이 여기에 접속 (docs/UI_SCREEN.md)
    options:
      bind: 127.0.0.1:8080        # 실기: 0.0.0.0:8080 (D가 C의 IP로 접속)
      static_dir: web/screen      # 화면 HTML·JS·CSS (화면 담당이 작성)
      exterior: [RGB]             # 외부 인원 카메라 이름. 나머지는 내부
      occupied_block_s: null      # OCCUPIED가 이만큼 계속되면 BLOCKED (DEC-007 미정 -> 사용 안 함)
      voice_repeat_s: {}          # 예: { OCCUPIED: 10 }
      voice_gap_s: 3.0

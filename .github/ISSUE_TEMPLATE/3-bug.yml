name: 문제 · 장애
description: 예상과 다르게 동작했거나, 시험 중 문제가 생겼을 때
title: "[문제] "
labels: ["문제"]
body:
  - type: checkboxes
    id: safety
    attributes:
      label: 안전 영향 (해당하면 꼭 체크)
      description: 체크되면 다른 작업보다 먼저 처리합니다.
      options:
        - label: 사람이 있었는데 "비었음(EMPTY)" 또는 초록불이 나갔다
        - label: 장애(카메라·통신)가 있었는데 "판단 불가"로 가지 않았다
  - type: dropdown
    id: board
    attributes:
      label: 어디서 생겼나요?
      multiple: true
      options:
        - Pi A
        - Pi B
        - Pi RGB
        - Pi C
        - ESP32 · 신호등
        - PC (시뮬레이션 · CI)
        - 모름
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? 원래는 어떻게 되어야 하나요?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 다시 일으키는 방법
      placeholder: |
        1. Pi A에서 python -m psafe --config config/node_a.yaml 실행
        2. 카메라 케이블 분리
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: 로그 · 사진 · 영상
      description: 터미널 출력, 화면 사진 등. 코드 커밋 번호(git log -1)도 적어 주세요.
      render: text

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psafe"
version = "0.1.0"
description = "기계식 주차장 차량 내 잔류 인원 감지 시스템 (Pi 5대: 카메라 노드 3 + 판정 허브 1 + 출력 1)"
requires-python = ">=3.11"
# 기본 의존성 = common이 쓰는 것만. 역할별 라이브러리는 아래 그룹으로 나눈다 (docs/ARCHITECTURE.md §7.3)
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# 카메라 Pi (A·B·RGB): 영상 처리와 YOLO 추론.
# Pi에는 화면이 없으므로 headless. 개발 PC에서 화면 표시(viewer)가 필요하면 opencv-python을 따로 설치한다.
node = ["opencv-python-headless", "onnxruntime"]
# Coral 카메라 Pi (Python 3.12): pip install -e ".[node,tflite]" -c requirements/tpu-py312.txt
tflite = ["tflite-runtime"]
# 최신 Python / Windows에서 TFLite 실행 (Edge TPU delegate 호환은 미검증)
litert = ["ai-edge-litert"]
# 판정 Pi (C) 판정부: 추가 라이브러리 없음 (순수 Python)
hub = []
# 출력 계층 (C: 상태 서버·콘솔은 표준 라이브러리만 / D: 신호등 ESP32 시리얼)
ui = ["pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/<영역>/ 아래에 같은 이름의 파일이 생길 수 있으므로 importlib 방식으로 모은다
addopts = "-m 'not slow' --import-mode=importlib"
markers = ["slow: real-time tests (threaded scenarios). Run with: pytest -m slow"]
